<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create a Responsive Flexbox Layout</title>
        <style>
            .flex-container {
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;

                background-color: yellow;
            }

            .flex-item {
                width: 200px;
                height: 200px;
                background-color: red;

                margin: 2rem;
            }
        </style>
    </head>
    <body>
        <div class="flex-container">
            <div class="flex-item">1</div>
            <div class="flex-item">2</div>
            <div class="flex-item">3</div>
        </div>
    </body>
</html>
