<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sidebar Menu</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <div class="main_box">
            <input type="checkbox" id="check" />

            <!-- Hamburger Button -->
            <div class="btn_one">
                <label for="check">
                    <i class="fa-solid fa-bars"></i>
                </label>
            </div>

            <!-- Sidebar -->
            <div class="sidebar_menu">
                <!-- Logo -->
                <div class="logo">
                    <a href="#">KP Studios</a>
                </div>

                <!-- Close Button -->
                <div class="btn_two">
                    <label for="check">
                        <i class="fa-solid fa-xmark"></i>
                    </label>
                </div>

                <!-- Menu Section -->
                <div class="menu">
                    <ul>
                        <li>
                            <i class="fa-solid fa-image"></i>
                            <a href="#">Gallery</a>
                        </li>
                        <li>
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <a href="#">Shortcuts</a>
                        </li>
                        <li>
                            <i class="fa-solid fa-photo-film"></i>
                            <a href="#">Exhibits</a>
                        </li>
                        <li>
                            <i class="fa-solid fa-calendar-days"></i>
                            <a href="#">Events</a>
                        </li>
                        <li>
                            <i class="fa-solid fa-store"></i>
                            <a href="#">Store</a>
                        </li>
                        <li>
                            <i class="fa-solid fa-phone"></i>
                            <a href="#">Contact</a>
                        </li>
                        <li>
                            <i class="fa-regular fa-comments"></i>
                            <a href="#">Feedback</a>
                        </li>
                    </ul>
                </div>

                <!-- Social Media -->
                <div class="social_media">
                    <ul>
                        <li>
                            <a href="https://www.linkedin.com/in/kaushal-prajapati-b651a8334/" target="_blank" rel="noopener noreferrer" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                        </li>
                        <li>
                            <a href="https://github.com/KaushalxPrajapati" target="_blank" rel="noopener noreferrer" title="GitHub"><i class="fa-brands fa-github"></i></a>
                        </li>
                        <li>
                            <a href="https://instagram.com/kaushalxprajapati" target="_blank" rel="noopener noreferrer" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                        </li>
                        <li>
                            <a href="mailto:kaushalxprajapati@gmail.com" title="Email"><i class="fa-solid fa-envelope"></i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
